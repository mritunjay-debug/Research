name: Deploy citation checker to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "citation-verification.html"
      - "literature.html"
      - "workspace.html"
      - "manuscript-audit.html"
      - "thesis-manuscript-studio.html"
      - "research-tools.html"
      - "data-analysis-figure.js"
      - "research-planning.html"
      - "research-library.html"
      - "journal-finder.js"
      - "research-tools-cloud-sync.js"
      - "literature-cloud-sync.js"
      - "supabase/migrations/**"
      - "design.css"
      - "supabase-auth.js"
      - "workspace-cloud-sync.js"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate static site and inline JavaScript
        run: node scripts/smoke-test.mjs
      - name: Test reference deduplication logic
        run: node scripts/reference-dedup-regression-test.mjs
      - name: Test data analysis ingestion and profiling
        run: node scripts/data-analysis-core-test.mjs
      - name: Test descriptive statistics against reference fixtures
        run: node scripts/data-analysis-stats-test.mjs
      - name: Test publication figure engine conversion
        run: node scripts/data-analysis-figure-test.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed critical pages
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/live-smoke-test.mjs
